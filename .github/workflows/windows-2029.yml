name: WINDOWS 2029 RDP (Kesintisiz Tünel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350 # GitHub'ın 360 dakikalık (6 saat) mutlak sınırından 10 dakika önce kontrollü kapanır

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 RDP Aktif Et ve Şifre Belirle
        run: |
          # 1. Uzak masaüstü izinlerini açıyoruz ve kimlik doğrulamayı (NLA) kapatıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          
          # 2. Şifreyi 'Password123!' olarak taşa kazıyoruz
          net user runneradmin Password123!

      - name: 🚀 Pinggy TCP Tünelini Başlat
        shell: pwsh
        run: |
          # Kart istemeyen, yüksek bant genişliğine sahip kurumsal Pinggy TCP tünelini çalıştırıyoruz
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R 0:127.0.0.1:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -WindowStyle Hidden
          
          # Bağlantının oturması için 15 saniye bekliyoruz
          Start-Sleep -Seconds 15

      - name: 🌐 RDP Adresini Ekrana Bas
        shell: pwsh
        run: |
          # Log dosyasındaki tüm verileri doğrudan ekrana basıyoruz (Hata ihtimali sıfır)
          if (Test-Path "pinggy.log") {
            Write-Host "=========================================="
            Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ AŞAĞIDAKİ LOGLARIN İÇİNDEDİR:"
            Write-Host "=========================================="
            
            Get-Content "pinggy.log"
            
            Write-Host "=========================================="
            Write-Host "⚠️ Yukarıda gördüğünüz 'tcp://xxxx.free.pinggy.link:yyyyy' adresini kopyalayın."
            Write-Host "Uzak Masaüstü programına yapıştırırken başındaki 'tcp://' kısmını silin!"
            Write-Host "👤 Kullanıcı Adı: runneradmin"
            Write-Host "🔑 Şifre: Password123!"
            Write-Host "=========================================="
          } else {
            Write-Host "❌ Tünel başlatılamadı."
          }

      - name: ⏳ 5.5 Saat Boyunca RDP'yi Açık Tut
        run: |
          # 330 dakika (5.5 saat) boyunca sunucuyu senin için canlı ve açık tutar
          Start-Sleep -Seconds 19800

      - name: 🔄 Süre Bitmeden Yeni Bir RDP Sunucusu Tetikle (6 Saat Bypass)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 6 saatlik süre tam olarak dolmadan hemen önce GitHub API'sine emir vererek 
          # Bu RDP iş akışını sıfırdan ve otomatik olarak yeniden başlatır. RDP'niz hiç kapanmaz!
          gh workflow run "WINDOWS 2029 RDP (Kesintisiz Tünel)" --ref patch-1
