name: WINDOWS 2029 RDP (Absolute Final Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # 1. RDP bağlantısını aktif ediyoruz ve şifreyi kesinleştiriyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Start Reliable Loophole TCP Tunnel
        shell: pwsh
        run: |
          # 2. Güvenilir ve tamamen ücretsiz Loophole TCP aracını sunucuya çekiyoruz
          Invoke-WebRequest -Uri "https://github.com" -OutFile "loophole.zip"
          tar -xf loophole.zip
          
          # 3. Tüneli arka planda başlatıp logları kaydediyoruz
          Start-Process -FilePath ".\loophole.exe" -ArgumentList "tcp 3389" -RedirectStandardOutput "loophole.log" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          # 4. Log dosyasından adresi çekip ekrana yazdırıyoruz
          if (Test-Path "loophole.log") {
            $Log = Get-Content "loophole.log" -Raw
            if ($Log -match "tcp:\/\/.*:\d+") {
               $RdpAddress = $Matches[0] -replace "tcp://", ""
               Write-Host "=========================================="
               Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ BAŞARIYLA OLUŞTU!"
               Write-Host "Uzak Masaüstü programına aynen şu adresi yazın:"
               Write-Host $RdpAddress
               Write-Host "=========================================="
               Write-Host "👤 Kullanıcı Adı: runneradmin"
               Write-Host "🔑 Şifre: Password123!"
               Write-Host "=========================================="
            } else {
               Write-Host "❌ Tünel başlatıldı fakat adres alınamadı. Log çıktısı:"
               Write-Host $Log
            }
          } else {
            Write-Host "❌ Tünel log dosyası oluşturulamadı."
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
