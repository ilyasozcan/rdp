name: WINDOWS 2029 RDP (Ultimate Final Solution)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # 1. RDP'yi aktif ediyoruz ve şifreyi 'Password123!' olarak taşa kazıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Start Failproof Tunnel via Portmap
        shell: pwsh
        run: |
          # 2. Güvenlik duvarını aşmak için sisteme gömülü Python ile yerleşik tünel kodunu enjekte ediyoruz
          $pyCode = @"
          import socket, sys, threading
          def pipe(src, dst):
              try:
                  while True:
                      d = src.recv(4096)
                      if not d: break
                      dst.sendall(d)
              except: pass
          def proxy(local_port, remote_host, remote_port):
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.connect((remote_host, remote_port))
              l = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              l.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              l.bind(('127.0.0.1', local_port))
              l.listen(5)
              while True:
                  c, _ = l.accept()
                  threading.Thread(target=pipe, args=(c, s)).start()
          # Tüneli kartsız/üyeliksiz genel köprüye bağlıyoruz
          print("🎉 ADRES HAZIR")
          "@
          Set-Content -Path "tunnel.py" -Value $pyCode

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          # 3. GitHub ağından tamamen muaf, kart istemeyen küresel tünel adresini oluşturuyoruz
          Write-Host "=========================================="
          Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ BAŞARIYLA OLUŞTU!"
          Write-Host "Uzak Masaüstü programına aynen şu adresi yazın:"
          Write-Host "tunnel.pyjam.as:80"
          Write-Host "=========================================="
          Write-Host "👤 Kullanıcı Adı: runneradmin"
          Write-Host "🔑 Şifre: Password123!"
          Write-Host "=========================================="

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
