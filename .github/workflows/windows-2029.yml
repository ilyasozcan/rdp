name: WINDOWS 2029 RDP (Pagekite)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 🚀 Start TCP Tunnel via Pagekite
        shell: pwsh
        run: |
          # Python tabanlı ve kart istemeyen Pagekite aracını indiriyoruz
          Invoke-WebRequest -Uri "https://pagekite.net" -OutFile "pagekite.py"
          
          # Rastgele ve benzersiz bir subdomain oluşturuyoruz
          $RandomName = "github-rdp-" + (Get-Random -Minimum 10000 -Maximum 99999)
          
          # Tüneli arka planda başlatıyoruz (Kart veya şifre istemez)
          Start-Process -FilePath "python" -ArgumentList "pagekite.py 3389 tcp:$RandomName.pagekite.me" -RedirectStandardOutput "tunnel.log" -WindowStyle Hidden
          
          # Bağlantının oturması için bekliyoruz
          Start-Sleep -Seconds 15
          
          # Bilgileri ekrana yazdırmak için kaydediyoruz
          Set-Content -Path "rdp_address.txt" -Value "$RandomName.pagekite.me"

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          if (Test-Path "rdp_address.txt") {
            $Address = Get-Content "rdp_address.txt"
            Write-Host "=========================================="
            Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ:"
            Write-Host $Address
            Write-Host "=========================================="
            Write-Host "⚠️ Bağlanırken Uzak Masaüstü programına port yazmayın."
            Write-Host "Sadece yukarıdaki adresi yapıştırıp bağlanın."
            Write-Host "=========================================="
          } else {
            Write-Host "❌ Tünel adresi oluşturulamadı."
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
