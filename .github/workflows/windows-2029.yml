name: WINDOWS 2029 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 🚀 Start Ngrok Tunnel via Node.js SDK
        shell: pwsh
        run: |
          # 1. Resmi güncel ngrok kütüphanesini kuruyoruz
          npm install @ngrok/ngrok
          
          # 2. Arka planda çalışacak ve tüneli Javascript ile açacak scripti oluşturuyoruz
          $jsCode = @"
          const ngrok = require('@ngrok/ngrok');
          (async function() {
            try {
              const session = await new ngrok.SessionBuilder()
                .authtoken("3FzH9IzzHPXS7X4MlMj9Jy3fNEH_6fFMfBZcGQ6KjqF2kpY7a")
                .connect();
              const tunnel = await session.tcpEndpoint()
                .listen();
              console.log('==========================================');
              console.log('🎉 RDP BAĞLANTI ADRESİNİZ:');
              console.log(tunnel.url());
              console.log('==========================================');
              
              // Tünelin açık kalması için döngü
              setInterval(() => {}, 1000);
            } catch (err) {
              console.error('❌ Tünel başlatılamadı:', err);
              process.exit(1);
            }
          })();
          "@
          
          Set-Content -Path "start_tunnel.js" -Value $jsCode
          
          # 3. Scripti arka planda başlatıyoruz
          Start-Process -FilePath "node" -ArgumentList "start_tunnel.js" -WindowStyle Hidden
          
          # Tünelin adresi loglara yazması için biraz bekliyoruz
          Start-Sleep -Seconds 10

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
