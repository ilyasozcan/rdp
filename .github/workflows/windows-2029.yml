name: WINDOWS 2029 RDP (Kesintisiz Tünel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350 # 6 saatlik mutlak sınırdan 10 dakika önce kontrollü kapanır

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 RDP Aktif Et ve Şifre Belirle
        run: |
          # 1. RDP izinlerini açıp şifreyi kesin olarak 'Password123!' yapıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Pinggy TCP Tünelini Başlat (Hatasız)
        shell: pwsh
        run: |
          # 2. KRİTİK DÜZELTME: SSH onay ekranını baypas etmek için StrictHostKeyChecking=no ekledik
          # Ayrıca Pinggy sunucusunun adresi algılaması için tcp@free.pinggy.io formatını zorladık
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 443 -R 0:127.0.0.1:3389 tcp@free.pinggy.io" -RedirectStandardOutput "pinggy.log" -WindowStyle Hidden
          
          # Bağlantının oturması ve adresi sunucudan çekmesi için 20 saniye bekliyoruz
          Start-Sleep -Seconds 20

      - name: 🌐 RDP Adresini Ekrana Bas
        shell: pwsh
        run: |
          # 3. Log dosyasındaki tüm verileri doğrudan ekrana basıyoruz
          if (Test-Path "pinggy.log") {
            Write-Host "=========================================="
            Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ AŞAĞIDAKİ LOGLARIN İÇİNDEDİR:"
            Write-Host "=========================================="
            
            Get-Content "pinggy.log"
            
            Write-Host "=========================================="
            Write-Host "⚠️ Yukarıda gördüğünüz 'tcp://xxxx.free.pinggy.link:yyyyy' adresini kopyalayın."
            Write-Host "Uzak Masaüstü programına yapıştırırken başındaki 'tcp://' kısmını silin!"
            Write-Host "👤 Kullanıcı Adı: runneradmin"
            Write-Host "🔑 Şifre: Password123!"
            Write-Host "=========================================="
          } else {
            Write-Host "❌ Tünel başlatılamadı."
          }

      - name: ⏳ RDP'yi Açık Tut
        run: |
          # Sunucuyu senin için canlı ve açık tutar
          while ($true) {
            Start-Sleep -Seconds 60
          }
