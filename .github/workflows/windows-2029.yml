name: WINDOWS 2029 RDP (Ngrok Absolute Absolute Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # 1. RDP izinlerini açıp şifreyi kesin olarak 'Password123!' yapıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 📦 Setup Official Ngrok v3 via NPM
        run: |
          # 2. Hata veren choco ve zip yöntemleri yerine doğrudan NPM ile orijinal Ngrok v3 kuruyoruz
          npm install -g ngrok

      - name: 🚀 Start Ngrok Tunnel bypassing Credit Card
        shell: pwsh
        run: |
          # 3. BURAYI DEĞİŞTİRİN: Kendi ngrok tokenınızı tırnak işaretleri arasına yazın
          $MyToken = "3FzH9IzzHPXS7X4MlMj9Jy3fNEH_6fFMfBZcGQ6KjqF2kpY7a"
          
          # 4. Tokenı sisteme kaydediyoruz
          ngrok config add-authtoken $MyToken
          
          # 5. Kredi kartı engelini aşmak için TCP'yi doğrudan ngrok'un temel bölge sunucularıyla tetikliyoruz
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389 --region=us" -RedirectStandardOutput "ngrok_output.log" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          # 6. Ngrok API'sinden o donmayan, hızlı bağlantı adresini çekiyoruz
          $ngrokApiUrl = "http" + "://" + "127.0.0.1" + ":" + "4040" + "/api/tunnels"
          try {
            $Response = Invoke-RestMethod -Uri $ngrokApiUrl -TimeoutSec 10
            if ($Response -and $Response.tunnels) {
              $CleanUrl = $Response.tunnels.public_url -replace "tcp://", ""
              Write-Host "=========================================="
              Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ KESİN OLARAK HAZIR!"
              Write-Host "Windows Uzak Masaüstü programına aynen şunu yazın:"
              Write-Host $CleanUrl
              Write-Host "=========================================="
              Write-Host "👤 Kullanıcı Adı: runneradmin"
              Write-Host "🔑 Şifre: Password123!"
              Write-Host "=========================================="
            }
          } catch {
            Write-Host "❌ Adres alınamadı. Log çıktısı:"
            if (Test-Path ngrok_output.log) { Get-Content ngrok_output.log }
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
