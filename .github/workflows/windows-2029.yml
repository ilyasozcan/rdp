name: WINDOWS 2029 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🗑️ Nuke Old Ngrok & Download Official Ngrok v3
        run: |
          # 1. Sistemde kayıtlı olabilecek tüm eski ngrok dosyalarını zorla temizliyoruz
          Get-Command ngrok -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item $_.Path -Force -ErrorAction SilentlyContinue }
          Remove-Item C:\ProgramData\chocolatey\bin\ngrok.exe -Force -ErrorAction SilentlyContinue
          Remove-Item C:\ProgramData\chocolatey\lib\ngrok -Recurse -Force -ErrorAction SilentlyContinue

          # 2. Resmi ngrok v3'ü GitHub engeline takılmayan doğrudan güvenli CDN linkinden indiriyoruz
          $Url = "https://equinox.io"
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $Url -OutFile "ngrok3.zip"

          # 3. Dosyayı doğrudan Windows'un dahili tar aracıyla klasör karmaşası olmadan açıyoruz
          tar -xf ngrok3.zip

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 🚀 Start Ngrok Tunnel with Token
        run: |
          # 4. Kesinlikle şu an indirdiğimiz güncel yerel ".\ngrok.exe" dosyasını çağırıyoruz
          # Parametrik authtoken kullanarak sistem kayıt dosyası karmaşasını tamamen baypas ediyoruz
          cmd /c "start /b .\ngrok.exe tcp 3389 --authtoken=3FzH9IzzHPXS7X4MlMj9Jy3fNEH_6fFMfBZcGQ6KjqF2kpY7a > ngrok_output.log 2>&1"

      - name: 🌐 Get RDP URL
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          $ngrokApiUrl = "http" + "://" + "127.0.0.1" + ":" + "4040" + "/api/tunnels"
          
          try {
            $Response = Invoke-RestMethod -Uri $ngrokApiUrl -TimeoutSec 10
            if ($Response -and $Response.tunnels) {
              Write-Host "=========================================="
              Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ:"
              Write-Host $Response.tunnels.public_url
              Write-Host "=========================================="
            } else {
              throw "Tunnels datası boş döndü."
            }
          } catch {
            Write-Host "❌ Ngrok API bağlantısı kurulamadı."
            Write-Host "---------------- Ngrok Çıktısı ----------------"
            if (Test-Path ngrok_output.log) { 
              Get-Content ngrok_output.log 
            } else { 
              Write-Host "Log dosyası oluşturulamadı." 
            }
            Write-Host "-----------------------------------------------"
            exit 1
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
