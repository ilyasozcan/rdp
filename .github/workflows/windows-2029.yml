name: WINDOWS 2029 RDP

on:
  workflow_dispatch:
    inputs:
      increment:
        type: string
        description: 'ngrok token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install Ngrok via Chocolatey
        run: |
          choco install ngrok -y

      - name: 🔐 Set Ngrok Authtoken
        shell: pwsh
        run: |
          $inputToken = '${{ github.event.inputs.increment }}'
          $envToken = '${{ secrets.NGROK_AUTH }}'
          if ($inputToken) { $token = $inputToken } else { $token = $envToken }
          if (-not $token) { Write-Host "❌ No token found!"; exit 1 }
          ngrok config add-authtoken $token

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 🚀 Start Ngrok Tunnel (Hidden Window)
        run: |
          # Logları kaydederek arka planda tüneli başlatıyoruz
          Start-Process -WindowStyle Hidden PowerShell -ArgumentList 'ngrok tcp 3389 --log=stdout > ngrok.log'

      - name: 🌐 Get RDP URL
        run: |
          # Tünelin oturması için 15 saniye bekliyoruz
          Start-Sleep -Seconds 15
          $Response = Invoke-RestMethod -Uri "http://127.0.0" -ErrorAction SilentlyContinue
          if ($Response) {
            Write-Host "=========================================="
            Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ:"
            Write-Host $Response.tunnels.public_url
            Write-Host "=========================================="
          } else {
            Write-Host "❌ Ngrok URL alınamadı. Ngrok hata detayları aşağıdadır:"
            Write-Host "------------------------------------------"
            if (Test-Path ngrok.log) { Get-Content ngrok.log } else { Write-Host "Log dosyası bulunamadı." }
            Write-Host "------------------------------------------"
            exit 1
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
