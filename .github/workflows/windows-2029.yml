name: WINDOWS 2029 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Download and Install Official Ngrok v3
        run: |
          # Zip dertleri veya choco hatası olmadan, resmi ngrok v3 exe'sini direkt indiriyoruz
          Invoke-WebRequest -Uri "https://equinox.io" -OutFile "ngrok.zip"
          
          # PowerShell'in hata veren Expand-Archive komutu yerine Windows'un dahili tar aracını temiz bir klasöre açtırıyoruz
          New-Item -ItemType Directory -Force -Path .\ngrok_bin
          tar -xf ngrok.zip -C .\ngrok_bin
          
          # ngrok.exe'yi sistemin her yerinden çalışacak şekilde PATH'e ekliyoruz
          Move-Item -Path .\ngrok_bin\ngrok.exe -Destination C:\Windows\System32\ngrok.exe -Force

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 🚀 Start Ngrok Tunnel with Token
        run: |
          # Kesinlikle v3 sürümü üzerinden tüneli ve tokenı ateşliyoruz
          cmd /c "start /b ngrok tcp 3389 --authtoken=3FzH9IzzHPXS7X4MlMj9Jy3fNEH_6fFMfBZcGQ6KjqF2kpY7a > ngrok_output.log 2>&1"

      - name: 🌐 Get RDP URL
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          $ngrokApiUrl = "http" + "://" + "127.0.0.1" + ":" + "4040" + "/api/tunnels"
          
          try {
            $Response = Invoke-RestMethod -Uri $ngrokApiUrl -TimeoutSec 10
            if ($Response -and $Response.tunnels) {
              Write-Host "=========================================="
              Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ:"
              Write-Host $Response.tunnels.public_url
              Write-Host "=========================================="
            } else {
              throw "Tunnels datası boş döndü."
            }
          } catch {
            Write-Host "❌ Ngrok API bağlantısı kurulamadı."
            Write-Host "---------------- Ngrok Çıktısı ----------------"
            if (Test-Path ngrok_output.log) { 
              Get-Content ngrok_output.log 
            } else { 
              Write-Host "Log dosyası oluşturulamadı." 
            }
            Write-Host "-----------------------------------------------"
            exit 1
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
