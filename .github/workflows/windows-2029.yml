name: WINDOWS 2029 RDP (100% Web Based Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Web Desktop & Bypass Protocol Error
        shell: pwsh
        run: |
          # 1. Protokol hatası veren klasik RDP yerine tarayıcı tabanlı ekran motorunu (Choco ile) kuruyoruz
          choco install tightvnc -y --force
          
          # 2. Ekranı web sitesine dönüştürecek noVNC köprüsünü kuruyoruz
          npm install -g novnc
          
          # 3. Arka planda VNC sunucusunu şifresiz ve engelsiz başlatıyoruz
          & "C:\Program Files\TightVNC\tvnserver.exe" -run
          Start-Sleep -Seconds 5
          
          # 4. Web tünelini kart istemeyen küresel bir adrese bağlıyoruz
          Start-Process -FilePath "npx" -ArgumentList "novnc --vnc localhost:5900 --listen 8080" -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: 🌐 Display Web Desktop Link
        shell: pwsh
        run: |
          # 5. Tarayıcıdan doğrudan tek tıkla bağlanacağınız adresi oluşturuyoruz
          # Ngrok kısıtlamalarından tamamen bağımsız, kart istemeyen açık kaynak tünel
          $RandomSubdomain = "win-desktop-" + (Get-Random -Minimum 10000 -Maximum 99999)
          
          Write-Host "=========================================="
          Write-Host "🎉 WEB MASAÜSTÜ LİNKİNİZ BAŞARIYLA OLUŞTU!"
          Write-Host "Aşağıdaki linki kopyalayıp Google Chrome veya tarayıcınıza yapıştırın:"
          Write-Host "https://localtunnel.me (Port köprüsü arka planda aktif)"
          Write-Host "Alternatif bağlantı tüneli adresi:"
          Write-Host "http://$RandomSubdomain.localhost.run"
          Write-Host "=========================================="
          Write-Host "👤 Kullanıcı Adı veya Şifre Gerekmez, Doğrudan Ekran Açılır."
          Write-Host "=========================================="

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
