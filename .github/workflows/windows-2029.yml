name: WINDOWS 2029 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 🚀 Start Ngrok Tunnel via Node.js SDK
        shell: pwsh
        run: |
          # 1. Resmi ngrok Node.js motorunu kuruyoruz
          npm install @ngrok/ngrok
          
          # 2. Logları bir dosyaya yazacak şekilde Javascript kodunu güncelliyoruz
          $jsCode = @"
          const ngrok = require('@ngrok/ngrok');
          const fs = require('fs');
          (async function() {
            try {
              const session = await new ngrok.SessionBuilder()
                .authtoken("3FzH9IzzHPXS7X4MlMj9Jy3fNEH_6fFMfBZcGQ6KjqF2kpY7a")
                .connect();
              const tunnel = await session.tcpEndpoint()
                .listen();
              
              // Adresi GitHub'ın okuyabilmesi için dosyaya yazıyoruz
              fs.writeFileSync('rdp_url.txt', tunnel.url());
              
              setInterval(() => {}, 1000);
            } catch (err) {
              fs.writeFileSync('rdp_url.txt', 'HATA: ' + err.message);
              process.exit(1);
            }
          })();
          "@
          
          Set-Content -Path "start_tunnel.js" -Value $jsCode
          
          # 3. Süreci arka planda başlatıyoruz
          Start-Process -FilePath "node" -ArgumentList "start_tunnel.js" -WindowStyle Hidden
          
          # Tünelin adresi dosyaya yazması için 12 saniye bekliyoruz
          Start-Sleep -Seconds 12

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          # Oluşan adresi okuyor ve doğrudan GitHub ekranına basıyoruz
          if (Test-Path "rdp_url.txt") {
            $Url = Get-Content "rdp_url.txt"
            Write-Host "=========================================="
            Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ:"
            Write-Host $Url
            Write-Host "=========================================="
          } else {
            Write-Host "❌ Adres dosyası henüz oluşturulamadı."
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
