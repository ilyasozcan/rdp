name: WINDOWS 2029 RDP

on:
  workflow_dispatch:
    inputs:
      increment:
        type: string
        description: 'ngrok token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔽 Download Ngrok
        run: |
          Invoke-WebRequest https://equinox.io -OutFile ngrok.zip

      - name: 📦 Extract Ngrok
        run: |
          # Klasör çakışmalarını önlemek için -Force parametresi ekledik
          Expand-Archive -Path ngrok.zip -DestinationPath . -Force

      - name: 🔐 Set Ngrok Authtoken
        shell: pwsh
        run: |
          $inputToken = '${{ github.event.inputs.increment }}'
          $envToken = '${{ secrets.NGROK_AUTH }}'
          if ($inputToken) { $token = $inputToken } else { $token = $envToken }
          if (-not $token) { Write-Host "❌ No token found!"; exit 1 }
          .\ngrok.exe config add-authtoken $token

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 🚀 Start Ngrok Tunnel (Hidden Window)
        run: Start-Process -WindowStyle Hidden PowerShell -ArgumentList '.\ngrok.exe tcp --region ap 3389'

      - name: 🌐 Get RDP URL
        run: |
          Start-Sleep -Seconds 12
          $Response = Invoke-RestMethod -Uri "http://127.0.0" -ErrorAction SilentlyContinue
          if ($Response) {
            Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ: $($Response.tunnels.public_url)"
          } else {
            Write-Host "❌ Ngrok URL alınamadı."
            exit 1
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
