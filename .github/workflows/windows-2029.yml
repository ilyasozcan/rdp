name: WINDOWS 2029 RDP (Official Microsoft Dev Tunnel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # RDP'yi aktif edip giriş şifresini 'Password123!' yapıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Start Microsoft Dev Tunnel
        shell: pwsh
        run: |
          # Microsoft'un resmi tünel motorunu misafir modunda başlatıyoruz (Kart/Şifre istemez)
          # 3389 RDP portunu doğrudan dış dünyaya güvenli TCP tüneli olarak açıyoruz
          Start-Process -FilePath "devtunnel" -ArgumentList "host -p 3389 --protocol tcp --anonymous" -RedirectStandardOutput "tunnel_output.log" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          if (Test-Path "tunnel_output.log") {
            $Log = Get-Content "tunnel_output.log" -Raw
            # Log dosyasından atanan resmi Microsoft bağlantı adresini ayıklıyoruz
            if ($Log -match "tcp:\/\/.*:\d+") {
               $CleanAddress = $Matches -replace "tcp://", ""
               Write-Host "=========================================="
               Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ BAŞARIYLA OLUŞTU!"
               Write-Host "Uzak Masaüstü programına aynen şu adresi yazın:"
               Write-Host $CleanAddress
               Write-Host "=========================================="
               Write-Host "👤 Kullanıcı Adı: runneradmin"
               Write-Host "🔑 Şifre: Password123!"
               Write-Host "=========================================="
            } else {
               Write-Host "❌ Tünel başlatıldı fakat adres alınamadı. Log çıktısı:"
               Write-Host $Log
            }
          } else {
            Write-Host "❌ Tünel log dosyası bulunamadı."
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
