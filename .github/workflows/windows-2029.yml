name: WINDOWS 2029 RDP (Pinggy Absolute Solution)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # 1. RDP izinlerini açıp şifreyi kesin olarak 'Password123!' yapıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Start Pinggy TCP Tunnel
        shell: pwsh
        run: |
          # 2. Resmi Pinggy dokümantasyonuna uygun olarak tcp@ ön ekiyle tüneli TCP modunda başlatıyoruz
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R 0:127.0.0.1:3389 tcp@free.pinggy.io" -RedirectStandardOutput "pinggy_output.log" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          # 3. Log dosyasından size atanan yüksek hızlı RDP adresini ayıklıyoruz
          if (Test-Path "pinggy_output.log") {
            $Log = Get-Content "pinggy_output.log" -Raw
            if ($Log -match ".\.free\.pinggy\.link:\d+") {
               $RdpAddress = $Matches[0]
               Write-Host "=========================================="
               Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ KESİN OLARAK HAZIR!"
               Write-Host "Windows Uzak Masaüstü programına aynen şunu yazın:"
               Write-Host $RdpAddress
               Write-Host "=========================================="
               Write-Host "👤 Kullanıcı Adı: runneradmin"
               Write-Host "🔑 Şifre: Password123!"
               Write-Host "=========================================="
            } else {
               Write-Host "❌ Adres satırı henüz hazır değil veya log formatı değişti. Log çıktısı:"
               Write-Host $Log
            }
          } else {
            Write-Host "❌ Tünel log dosyası oluşturulamadı."
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
