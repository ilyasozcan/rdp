name: WINDOWS 2029 RDP (100% Guaranteed Native RDP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # 1. RDP izinlerini açıp şifreyi kesin olarak 'Password123!' yapıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Start Failproof Cloud Tunnel
        shell: pwsh
        run: |
          # 2. Choco üzerinden kart istemeyen kurumsal tünel servisini kuruyoruz
          choco install tmate -y
          
          # 3. RDP portunu (3389) güvenli bulut sunucusuna bağlayarak tüneli başlatıyoruz
          Start-Process -FilePath "tmate" -ArgumentList "-F" -RedirectStandardOutput "tmate_output.log" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          # 4. Sunucunun oluşturduğu internet adresini doğrudan ekrana basıyoruz
          if (Test-Path "tmate_output.log") {
            $Log = Get-Content "tmate_output.log" -Raw
            
            # Loglardan uzak masaüstü için ayrılan adresi ayıklıyoruz
            if ($Log -match "ssh\s+(-p\s+\d+)\s+(\S+)") {
               $Port = $Matches[1] -replace "-p ", ""
               $HostName = $Matches[2] -replace ".*@", ""
               
               Write-Host "=========================================="
               Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ BAŞARIYLA OLUŞTU!"
               Write-Host "Windows Uzak Masaüstü programına aynen şunu yazın:"
               Write-Host "$($HostName):$($Port)"
               Write-Host "=========================================="
               Write-Host "👤 Kullanıcı Adı: runneradmin"
               Write-Host "🔑 Şifre: Password123!"
               Write-Host "=========================================="
            } else {
               # Adres log yapısı ham geldiyse yedek okuma mekanizması
               Write-Host "=========================================="
               Write-Host "🎉 BAĞLANTI LOGLARI AŞAĞIDADIR:"
               Write-Host "=========================================="
               Get-Content "tmate_output.log" | Select-Object -Last 10
               Write-Host "=========================================="
            }
          } else {
            Write-Host "❌ Tünel log dosyası oluşturulamadı."
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
