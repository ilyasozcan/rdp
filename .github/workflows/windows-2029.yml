name: WINDOWS 2029 RDP (Serveo Kesin Çözüm)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 RDP Bilgilerini Ekrana Bas
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "🎉 RDP BAĞLANTI BİLGİLERİNİZ"
          Write-Host "=========================================="
          Write-Host "Kendi bilgisayarınızda normal CMD açın ve şunu yazıp ENTER'a basın:"
          Write-Host "ssh -L 3333:githrdp2029:3389 serveo.net"
          Write-Host "=========================================="
          Write-Host "Ardından Uzak Masaüstü programını açıp şunu yazın:"
          Write-Host "127.0.0.1:3333"
          Write-Host "=========================================="
          Write-Host "👤 Kullanıcı Adı: runneradmin"
          Write-Host "🔑 Şifre: Password123!"
          Write-Host "=========================================="

      - name: 🔧 RDP Aktif Et ve Şifre Belirle
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          net user runneradmin Password123!

      - name: 🚀 Sunucuyu Güvenli SSH Köprüsüne Bağla
        shell: pwsh
        run: |
          # Rastgele isim yerine sabit ve temiz isim verdik, bağlantıyı canlı tutma komutları ekledik
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=10 -o ServerAliveCountMax=30 -R githrdp2029:3389:127.0.0.1:3389 serveo.net" -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: ⏳ RDP'yi Açık Tut
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
