name: WINDOWS 2029 RDP

on:
  workflow_dispatch:
    inputs:
      increment:
        type: string
        description: 'ngrok token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install Ngrok via Chocolatey
        run: |
          choco install ngrok -y

      - name: 🔐 Set Ngrok Authtoken
        shell: pwsh
        run: |
          $inputToken = '${{ github.event.inputs.increment }}'
          $envToken = '${{ secrets.NGROK_AUTH }}'
          if ($inputToken) { $token = $inputToken } else { $token = $envToken }
          if (-not $token) { Write-Host "❌ No token found!"; exit 1 }
          ngrok config add-authtoken $token

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 🚀 Start Ngrok Tunnel
        run: |
          # PowerShell çakışmalarını önlemek için arka planda doğrudan cmd ile başlatıyoruz
          cmd /c "start /b ngrok tcp 3389 > ngrok_output.log 2>&1"

      - name: 🌐 Get RDP URL
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          # PowerShell 7'nin IP adresini kısaltmasını önlemek için adresi açıkça değişkene atıyoruz
          $ngrokApiUrl = "http" + "://" + "127.0.0.1" + ":" + "4040" + "/api/tunnels"
          
          try {
            $Response = Invoke-RestMethod -Uri $ngrokApiUrl -TimeoutSec 10
            if ($Response -and $Response.tunnels) {
              Write-Host "=========================================="
              Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ:"
              Write-Host $Response.tunnels.public_url
              Write-Host "=========================================="
            } else {
              throw "Tunnels datası boş döndü."
            }
          } catch {
            Write-Host "❌ Ngrok API bağlantısı kurulamadı."
            Write-Host "---------------- Ngrok Çıktısı ----------------"
            if (Test-Path ngrok_output.log) { 
              Get-Content ngrok_output.log 
            } else { 
              Write-Host "Log dosyası oluşturulamadı. Ngrok hiç çalışmamış olabilir." 
            }
            Write-Host "-----------------------------------------------"
            exit 1
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
