name: WINDOWS 2029 RDP (Kesintisiz Tünel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 RDP Aktif Et ve Şifre Belirle
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Pinggy TCP Tünelini Başlat (Hatasız)
        shell: pwsh
        run: |
          # MUTLAK ÇÖZÜM: Tüm hata loglarını ve çıktıları tek dosyada toplamak için CMD yönlendirmesi kullandık
          cmd /c "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 443 -R 0:127.0.0.1:3389 tcp@free.pinggy.io > pinggy.log 2>&1"
          
          # Sunucunun yanıt vermesi için süreyi 25 saniyeye çıkardık
          Start-Sleep -Seconds 25

      - name: 🌐 RDP Adresini Ekrana Bas
        shell: pwsh
        run: |
          if (Test-Path "pinggy.log") {
            Write-Host "=========================================="
            Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ AŞAĞIDAKİ LOGLARIN İÇİNDEDİR:"
            Write-Host "=========================================="
            
            # Gelen tüm ham yanıtı (hata dahil) ekrana döküyoruz
            $LogData = Get-Content "pinggy.log"
            $LogData
            
            Write-Host "=========================================="
            Write-Host "⚠️ Yukarıda gördüğünüz 'xxxx.free.pinggy.link:yyyyy' adresini kopyalayın."
            Write-Host "👤 Kullanıcı Adı: runneradmin"
            Write-Host "🔑 Şifre: Password123!"
            Write-Host "=========================================="
          } else {
            Write-Host "❌ Tünel başlatılamadı."
          }

      - name: ⏳ RDP'yi Açık Tut
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
