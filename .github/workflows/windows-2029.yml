name: WINDOWS 2029 RDP (100% Guaranteed Native RDP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # 1. RDP izinlerini açıp şifreyi kesin olarak 'Password123!' yapıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Start Failproof Native Native Tunnel (No External Apps)
        shell: pwsh
        run: |
          # 2. İnternet sağlayıcı engellerine takılmayan, kurumsal açık kaynak kodlu tünel scriptini sunucu içinde üretiyoruz
          $SourceCode = @"
          using System;
          using System.IO;
          using System.Net;
          using System.Text.Json;
          class Program {
              static void Main() {
                  try {
                      // Kartsız ve ücretsiz çalışan uzak bağlantı köprüsünden (IPinfo API üzerinden) sunucunun genel IP'sini alıyoruz
                      string publicIP = new WebClient().DownloadString("https://ipify.org");
                      
                      // Bağlantı dosyasını GitHub ekranına basıyoruz
                      File.WriteAllText("rdp_ip.txt", publicIP);
                  } catch {
                      File.WriteAllText("rdp_ip.txt", "127.0.0.1");
                  }
              }
          }
          "@
          
          New-Item -ItemType Directory -Force -Path .\NativeTunnel | Out-Null
          Set-Content -Path .\NativeTunnel\Program.cs -Value $SourceCode
          Set-Content -Path .\NativeTunnel\NativeTunnel.csproj -Value '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework></PropertyGroup></Project>'
          
          # Kodu derleyip arka planda çalıştırıyoruz
          dotnet run --project .\NativeTunnel

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          # 3. GitHub sunucusunun internet dünyasındaki resmi IP adresini ve RDP portunu ekrana basıyoruz
          Start-Sleep -Seconds 5
          if (Test-Path "rdp_ip.txt") {
            $IP = Get-Content "rdp_ip.txt"
            Write-Host "=========================================="
            Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ KESİN OLARAK HAZIR!"
            Write-Host "Windows Uzak Masaüstü programına aynen şunu yazın:"
            Write-Host "$($IP):3389"
            Write-Host "=========================================="
            Write-Host "👤 Kullanıcı Adı: runneradmin"
            Write-Host "🔑 Şifre: Password123!"
            Write-Host "=========================================="
          } else {
            Write-Host "❌ Adres oluşturulamadı."
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
