name: WINDOWS 2029 RDP (Kesintisiz ve Garantili)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 RDP Aktif Et ve Şifre Belirle
        run: |
          # 1. RDP ve Kimlik Doğrulama izinlerini ayarlıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          
          # 2. Giriş şifresini 'Password123!' yapıyoruz
          net user runneradmin Password123!

      - name: 🚀 Kurumsal Cloudflare Tünelini Başlat (Kart/Üyelik İstemez)
        shell: pwsh
        run: |
          # 3. Microsoft ve GitHub engellerine takılmayan resmi Cloudflare aracını indiriyoruz
          Invoke-WebRequest -Uri "https://github.com" -OutFile "cloudflared.msi"
          Start-Process msiexec.exe -ArgumentList '/i cloudflared.msi /qn' -Wait
          
          # 4. Kayıt olmadan anında genel bir tünel (Quick Tunnel) başlatıyoruz
          Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url rdp://localhost:3389" -RedirectStandardError "cloudflare.log" -WindowStyle Hidden
          Start-Sleep -Seconds 20

      - name: 🌐 RDP Adresini Ekrana Bas
        shell: pwsh
        run: |
          # 5. Cloudflare'in oluşturduğu o muazzam ve donmayan hızlı adresi ekrana basıyoruz
          if (Test-Path "cloudflare.log") {
            $Log = Get-Content "cloudflare.log" -Raw
            if ($Log -match "https:\/\/.*\.trycloudflare\.com") {
               $CleanUrl = $Matches[0] -replace "https://", ""
               Write-Host "=========================================="
               Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ KESİN OLARAK HAZIR!"
               Write-Host "Windows Uzak Masaüstü programına aynen şunu yazın:"
               Write-Host $CleanUrl
               Write-Host "=========================================="
               Write-Host "👤 Kullanıcı Adı: runneradmin"
               Write-Host "🔑 Şifre: Password123!"
               Write-Host "=========================================="
            } else {
               Write-Host "Yedek Adres Okuma Modu:"
               Get-Content "cloudflare.log" | Select-Object -Last 15
            }
          }

      - name: ⏳ RDP'yi Açık Tut
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
