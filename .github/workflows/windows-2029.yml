name: WINDOWS 2029 RDP (Serveo Kesin Çözüm)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 RDP Aktif Et ve Şifre Belirle
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          net user runneradmin Password123!

      - name: 🚀 Sunucuyu Bağla ve RDP'yi Açık Tut
        shell: pwsh
        run: |
          # 1. Bilgileri Konsol Kilidini Kırarak Anında Ekrana Bas
          $Output = @"
          ==========================================
          🎉 RDP BAĞLANTI BİLGİLERİNİZ HAZIR!
          ==========================================
          Kendi bilgisayarınızda normal CMD açın ve şunu yazıp ENTER'a basın:
          ssh -L 3333:githrdp2029:3389 serveo.net
          ==========================================
          Ardından Uzak Masaüstü programını açıp şunu yazın:
          127.0.0.1:3333
          ==========================================
          👤 Kullanıcı Adı: runneradmin
          🔑 Şifre: Password123!
          ==========================================
          "@
          [System.Console]::WriteLine($Output)
          [System.Console]::Out.Flush()

          # 2. SSH Tünelini Doğrudan Çalıştır (Bu komut sistemi kilitlenmeden açık tutar)
          # Serveo iç hatasını engellemek için TCP KeepAlive ve ServerAlive paketleri optimize edildi
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o TCPKeepAlive=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -R githrdp2029:3389:127.0.0.1:3389 serveo.net
