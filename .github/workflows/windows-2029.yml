name: WINDOWS 2029 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: RDP Kurulumu
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          net user runneradmin Password123!

      - name: Tunel Baglantisi
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Kullanici Adi: runneradmin"
          Write-Host "Sifre: Password123!"
          Write-Host "=========================================="
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 443 -R 0:127.0.0.1:3389 tcp@a.pinggy.link
