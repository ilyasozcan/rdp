name: WINDOWS 2029 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install Latest Ngrok v3 via Chocolatey
        run: |
          # Önceki choco önbelleğini temizleyip doğrudan en güncel resmi ngrok paketini kuruyoruz
          choco install ngrok -y --force

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: 🚀 Start Ngrok Tunnel with Token
        run: |
          # Güncel v3 sürümü üzerinden tüneli ve tokenı doğrudan ateşliyoruz
          cmd /c "start /b ngrok tcp 3389 --authtoken=3FzH9IzzHPXS7X4MlMj9Jy3fNEH_6fFMfBZcGQ6KjqF2kpY7a > ngrok_output.log 2>&1"

      - name: 🌐 Get RDP URL
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          $ngrokApiUrl = "http" + "://" + "127.0.0.1" + ":" + "4040" + "/api/tunnels"
          
          try {
            $Response = Invoke-RestMethod -Uri $ngrokApiUrl -TimeoutSec 10
            if ($Response -and $Response.tunnels) {
              Write-Host "=========================================="
              Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ:"
              Write-Host $Response.tunnels.public_url
              Write-Host "=========================================="
            } else {
              throw "Tunnels datası boş döndü."
            }
          } catch {
            Write-Host "❌ Ngrok API bağlantısı kurulamadı."
            Write-Host "---------------- Ngrok Çıktısı ----------------"
            if (Test-Path ngrok_output.log) { 
              Get-Content ngrok_output.log 
            } else { 
              Write-Host "Log dosyası oluşturulamadı." 
            }
            Write-Host "-----------------------------------------------"
            exit 1
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
