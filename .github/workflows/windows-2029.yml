name: WINDOWS 2029 RDP (Pinggy Absolute Solution)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # 1. RDP izinlerini açıp şifreyi kesin olarak 'Password123!' yapıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Start Pinggy TCP Tunnel
        shell: pwsh
        run: |
          # 2. Windows SSH istemci hatasını önlemek için localhost yerine doğrudan 127.0.0.1 IP adresini kullanıyoruz
          # Bağlantıyı resmi TCP adres havuzuna yönlendiriyoruz
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R 0:127.0.0.1:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy_output.log" -WindowStyle Hidden
          
          # Tünelin oturması ve adresi sunucudan çekmesi için 20 saniye bekliyoruz
          Start-Sleep -Seconds 20

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          # 3. Log dosyasının tamamını ekrana basıyoruz, böylece adresi elle doğrudan kopyalayabilirsiniz
          if (Test-Path "pinggy_output.log") {
            Write-Host "=========================================="
            Write-Host "🎉 NİHAİ BAĞLANTI LOGLARI AŞAĞIDADIR:"
            Write-Host "=========================================="
            
            # Log içeriğini ekrana temizce döküyoruz
            $Content = Get-Content "pinggy_output.log"
            $Content
            
            Write-Host "=========================================="
            Write-Host "⚠️ YUKARIDAKİ LOGLARDA GÖRDÜĞÜNÜZ 'tcp://....link:PORT' ADRESİNİ KOPYALAYIN."
            Write-Host "Uzak Masaüstü programına yapıştırırken başındaki 'tcp://' kısmını silin."
            Write-Host "👤 Kullanıcı Adı: runneradmin"
            Write-Host "🔑 Şifre: Password123!"
            Write-Host "=========================================="
          } else {
            Write-Host "❌ Tünel log dosyası oluşturulamadı."
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
