name: WINDOWS 2029 RDP (Secure TCP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # 1. RDP Bağlantısını aktif ediyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          
          # 2. Girişte kullanacağınız şifreyi kesin olarak 'Password123!' yapıyoruz
          net user runneradmin Password123! /add
          net localgroup administrators runneradmin /add

      - name: 🚀 Start Reliable TCP Tunnel via Serveo
        shell: pwsh
        run: |
          # Arka planda güvenli SSH tünelimizi başlatıyoruz
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -R 0:127.0.0.1:3389 serveo.net" -RedirectStandardOutput "serveo_output.txt" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          if (Test-Path "serveo_output.txt") {
            $Log = Get-Content "serveo_output.txt" -Raw
            if ($Log -match "serveo.net:\d+") {
               $RdpAddress = $Matches
               Write-Host "=========================================="
               Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ BAŞARIYLA OLUŞTU!"
               Write-Host "Uzak Masaüstü programına aynen şu adresi yazın:"
               Write-Host $RdpAddress
               Write-Host "=========================================="
               Write-Host "👤 Kullanıcı Adı: runneradmin"
               Write-Host "🔑 Şifre: Password123!"
               Write-Host "=========================================="
            } else {
               Write-Host "❌ Tünel başlatıldı fakat port numarası alınamadı. Log çıktısı:"
               Write-Host $Log
            }
          } else {
            Write-Host "❌ Tünel dosyası oluşturulamadı."
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
