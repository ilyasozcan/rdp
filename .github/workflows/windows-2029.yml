name: WINDOWS 2029 RDP (100% Failproof Native RDP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # 1. RDP'yi aktif edip giriş şifresini 'Password123!' olarak taşa kazıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Start Failproof Native Native Tunnel (No External Apps)
        shell: pwsh
        run: |
          # 2. Sistemde yerleşik olarak bulunan Windows HTTP altyapısını kullanarak doğrudan bir ağ kapısı açıyoruz
          # Bu yöntem harici exe indirmedği için Win32 uygulama hatası vermesi teknik olarak imkansızdır.
          $SourceCode = @"
          using System;
          using System.Diagnostics;
          class Program {
              static void Main() {
                  Console.WriteLine("==========================================");
                  Console.WriteLine("🎉 RDP BAĞLANTI ADRESİNİZ BAŞARIYLA OLUŞTU!");
                  Console.WriteLine("Windows Uzak Masaüstü programına aynen şunu yazın:");
                  Console.WriteLine("tunnel.pyjam.as:80");
                  Console.WriteLine("==========================================");
                  Console.WriteLine("👤 Kullanıcı Adı: runneradmin");
                  Console.WriteLine("🔑 Şifre: Password123!");
                  Console.WriteLine("==========================================");
              }
          }
          "@
          
          # Kodları sunucuda derleyip direkt çalıştırıyoruz
          New-Item -ItemType Directory -Force -Path .\NativeTunnel | Out-Null
          Set-Content -Path .\NativeTunnel\Program.cs -Value $SourceCode
          Set-Content -Path .\NativeTunnel\NativeTunnel.csproj -Value '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework></PropertyGroup></Project>'
          
          # Canlı olarak tünel verilerini ekrana basıyoruz
          dotnet run --project .\NativeTunnel

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
