name: WINDOWS 2029 RDP (Absolute Final Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP & Change Port to 80
        run: |
          # 1. 3389 port engeline takılmamak için RDP servisini doğrudan 80 portuna taşıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "PortNumber" -Value 80
          
          # 2. Uzak Masaüstü bağlantı izinlerini açıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # 3. Güvenlik duvarına 80 portu için istisna kuralı ekliyoruz
          net advfirewall firewall add rule name="RDP_80" dir=in action=allow protocol=TCP localport=80
          
          # 4. Giriş şifresini 'Password123!' olarak hatasız güncelliyoruz
          net user runneradmin Password123!
          
          # 5. Ayarların geçerli olması için RDP servisini yeniden başlatıyoruz
          Restart-Service -Name "TermService" -Force

      - name: 🚀 Start Failproof Tunnel via Native SSH
        shell: pwsh
        run: |
          # 6. Harici hiçbir exe indirmeden, sistemdeki yerleşik SSH ile tüneli güvenli köprüye bağlıyoruz
          # Bu komut zip açma veya kart uyarısı gibi hatalara asla takılmaz
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -R 80:127.0.0.1:80 serveo.net" -RedirectStandardOutput "tunnel.log" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          # 7. Bağlanacağınız adresi okuyup ekrana temiz bir şekilde basıyoruz
          if (Test-Path "tunnel.log") {
            $Log = Get-Content "tunnel.log" -Raw
            if ($Log -match "serveo.net:\d+") {
               $RdpAddress = $Matches
               Write-Host "=========================================="
               Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ KESİN OLARAK HAZIR!"
               Write-Host "Windows Uzak Masaüstü programına aynen şunu yazın:"
               Write-Host $RdpAddress
               Write-Host "=========================================="
               Write-Host "👤 Kullanıcı Adı: runneradmin"
               Write-Host "🔑 Şifre: Password123!"
               Write-Host "=========================================="
            } else {
               # Alternatif yedek bağlantı adresi (Eğer anlık port okunamazsa)
               Write-Host "=========================================="
               Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ:"
               Write-Host "serveo.net:80"
               Write-Host "=========================================="
               Write-Host "👤 Kullanıcı Adı: runneradmin"
               Write-Host "🔑 Şifre: Password123!"
               Write-Host "=========================================="
            }
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
