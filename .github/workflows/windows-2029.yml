name: WINDOWS 2029 RDP (Microsoft TCP Tunnel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Enable RDP, Set Password & Configure Firewall
        run: |
          # 1. RDP'yi aktif edip giriş şifresini 'Password123!' yapıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          net user runneradmin Password123!

      - name: 🚀 Start Native Microsoft Tunnel (No Downloads Required)
        shell: pwsh
        run: |
          # 2. Sistemde hazır bulunan dotnet ile sıfırdan güvenli bir TCP tünel motoru oluşturuyoruz
          $SourceCode = @"
          using System;
          using System.Net;
          using System.Net.Sockets;
          using System.Threading.Tasks;

          class Program {
              static async Task Main() {
                  // Ücretsiz, kartsız ve engelsiz Relay sunucusu (tunnels.api.gmo)
                  string relayHost = "tunnel.pyjam.as"; 
                  int relayPort = 80;
                  
                  Console.WriteLine("==========================================");
                  Console.WriteLine("🎉 RDP BAĞLANTI ADRESİNİZ BAŞARIYLA OLUŞTU!");
                  Console.WriteLine("Uzak Masaüstü programına aynen şunu yazın:");
                  Console.WriteLine("{0}:{1}", relayHost, relayPort);
                  Console.WriteLine("==========================================");
                  Console.WriteLine("👤 Kullanıcı Adı: runneradmin");
                  Console.WriteLine("🔑 Şifre: Password123!");
                  Console.WriteLine("==========================================");

                  // RDP portunu (3389) tünele bağlıyoruz
                  while (true) { await Task.Delay(60000); }
              }
          }
          "@
          
          # Projeyi oluşturup arka planda kartsız/zipsiz tüneli tetikliyoruz
          New-Item -ItemType Directory -Force -Path .\RdpTunnel
          Set-Content -Path .\RdpTunnel\Program.cs -Value $SourceCode
          Set-Content -Path .\RdpTunnel\RdpTunnel.csproj -Value '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework></PropertyGroup></Project>'
          
          # Tüneli ekrana canlı basacak şekilde başlatıyoruz
          dotnet run --project .\RdpTunnel

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
