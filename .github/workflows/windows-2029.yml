name: WINDOWS 2029 RDP (Instant TCP Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Force Disable NLA & Enable RDP
        run: |
          # 1. 0x1104 hatasına neden olan Sertifika ve Kimlik Doğrulama (NLA) protokolünü tamamen kapatıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          # 2. Standart RDP bağlantı izinlerini açıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # 3. Giriş şifresini 'Password123!' yapıyoruz
          net user runneradmin Password123!
          
          # 4. Ayarların geçerli olması için RDP servisini yeniliyoruz
          Restart-Service -Name "TermService" -Force

      - name: 🚀 Start Reliable Tunnel via Localhost.run
        shell: pwsh
        run: |
          # 5. Kart veya üyelik istemeyen, gömülü SSH üzerinden çalışan localhost.run altyapısını başlatıyoruz
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -R 3389:127.0.0.1:3389 tcp.localhost.run" -RedirectStandardOutput "tunnel.log" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: 🌐 Display RDP Connection URL
        shell: pwsh
        run: |
          if (Test-Path "tunnel.log") {
            $Log = Get-Content "tunnel.log" -Raw
            # Log dosyasından atanan özel TCP adresini ayıklıyoruz
            if ($Log -match "tun\.localhost\.run:\d+") {
               $RdpAddress = $Matches
               Write-Host "=========================================="
               Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ BAŞARIYLA OLUŞTU!"
               Write-Host "Windows Uzak Masaüstü programına aynen şu adresi yazın:"
               Write-Host $RdpAddress
               Write-Host "=========================================="
               Write-Host "👤 Kullanıcı Adı: runneradmin"
               Write-Host "🔑 Şifre: Password123!"
               Write-Host "=========================================="
            } else {
               # Alternatif adres yakalama şeması
               Write-Host "=========================================="
               Write-Host "🎉 RDP BAĞLANTI ADRESİNİZ:"
               Write-Host "tcp.localhost.run:3389"
               Write-Host "=========================================="
               Write-Host "👤 Kullanıcı Adı: runneradmin"
               Write-Host "🔑 Şifre: Password123!"
               Write-Host "=========================================="
            }
          }

      - name: ⏳ Keep Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
