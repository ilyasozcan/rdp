name: WINDOWS 2029 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 RDP Aktif Et ve Şifre Belirle
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          $user = 'runneradmin'
          $password = ConvertTo-SecureString 'Password123!' -AsPlainText -Force

          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name $user -Password $password
          }
          else {
            New-LocalUser `
              -Name $user `
              -Password $password `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword
          }

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $user `
            -ErrorAction SilentlyContinue

          Write-Host 'RDP aktif edildi.'

      - name: 🚀 Serveo SSH Tünelini Başlat
        shell: pwsh
        run: |
          $stdoutLog = "$env:TEMP\serveo-out.log"
          $stderrLog = "$env:TEMP\serveo-err.log"

          Remove-Item $stdoutLog -ErrorAction SilentlyContinue
          Remove-Item $stderrLog -ErrorAction SilentlyContinue

          $sshArgs = @(
            '-p', '443',
            '-N',
            '-o', 'StrictHostKeyChecking=no',
            '-o', 'UserKnownHostsFile=NUL',
            '-o', 'ServerAliveInterval=30',
            '-o', 'ServerAliveCountMax=3',
            '-R', 'rdp-gate:22:127.0.0.1:3389',
            'serveo.net'
          )

          Write-Host 'Serveo başlatılıyor...'

          $process = Start-Process `
            -FilePath 'ssh.exe' `
            -ArgumentList $sshArgs `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "SSH PID: $($process.Id)"

          Start-Sleep -Seconds 15

          if ($process.HasExited) {
            Write-Host "Serveo process kapandı. ExitCode: $($process.ExitCode)"

            Write-Host '===== STDOUT ====='
            if (Test-Path $stdoutLog) {
              Get-Content $stdoutLog
            }

            Write-Host '===== STDERR ====='
            if (Test-Path $stderrLog) {
              Get-Content $stderrLog
            }

            exit 1
          }

          Write-Host '===== SERVEO STDOUT ====='
          if (Test-Path $stdoutLog) {
            Get-Content $stdoutLog
          }

          Write-Host '===== SERVEO STDERR ====='
          if (Test-Path $stderrLog) {
            Get-Content $stderrLog
          }

          Write-Host 'Serveo SSH process çalışıyor.'

      - name: 🌐 Bağlantı Bilgilerini Göster
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '=========================================='
          Write-Host '          RDP TÜNELİ HAZIR'
          Write-Host '=========================================='
          Write-Host ''
          Write-Host 'Kendi bilgisayarında CMD / PowerShell aç:'
          Write-Host ''
          Write-Host 'ssh -p 443 -N -L 3333:rdp-gate:22 serveo.net'
          Write-Host ''
          Write-Host 'Bu pencereyi kapatma.'
          Write-Host ''
          Write-Host 'RDP: 127.0.0.1:3333'
          Write-Host 'Kullanıcı: runneradmin'
          Write-Host 'Şifre: Password123!'
          Write-Host ''
          Write-Host '=========================================='

      - name: 🔍 Tunnel Durumunu Kontrol Et
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner aktif..."
            Start-Sleep -Seconds 30
          }
