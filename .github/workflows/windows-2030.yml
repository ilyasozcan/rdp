name: WINDOWS 2029 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 RDP Aktif Et ve Şifre Belirle
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1

          net user runneradmin "Password123!"

          Write-Host "RDP aktif edildi."

      - name: 🚀 Serveo SSH Tünelini Başlat
        shell: pwsh
        run: |
          $log = "$env:TEMP\serveo.log"
          $errLog = "$env:TEMP\serveo.err"

          $args = @(
            "-p", "443",
            "-N",
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=NUL",
            "-o", "ServerAliveInterval=30",
            "-o", "ServerAliveCountMax=3",
            "-R", "rdp-gate:22:127.0.0.1:3389",
            "serveo.net"
          )

          Start-Process `
            -FilePath "ssh.exe" `
            -ArgumentList $args `
            -RedirectStandardOutput $log `
            -RedirectStandardError $errLog `
            -WindowStyle Hidden

          Start-Sleep -Seconds 15

          Write-Host "========== SERVEO LOG =========="
          if (Test-Path $log) {
            Get-Content $log
          }
          if (Test-Path $errLog) {
            Get-Content $errLog
          }
          Write-Host "================================"

      - name: 🌐 Bağlantı Bilgilerini Göster
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "        RDP TÜNELİ HAZIR"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Kendi bilgisayarında CMD aç:"
          Write-Host ""
          Write-Host "ssh -p 443 -N -L 3333:rdp-gate:22 serveo.net"
          Write-Host ""
          Write-Host "CMD PENCERESİNİ KAPATMA."
          Write-Host ""
          Write-Host "Sonra Uzak Masaüstü:"
          Write-Host ""
          Write-Host "127.0.0.1:3333"
          Write-Host ""
          Write-Host "Kullanıcı: runneradmin"
          Write-Host "Şifre: Password123!"
          Write-Host ""
          Write-Host "=========================================="

      - name: ⏳ RDP'yi Açık Tut
        shell: pwsh
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
