name: WINDOWS 2029 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 RDP Aktif Et ve Şifre Belirle
        shell: pwsh
        run: |
          Write-Host "RDP ayarlanıyor..."

          # RDP'yi etkinleştir
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          # RDP firewall kuralları
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          # Kullanıcı
          $user = 'runneradmin'
          $password = ConvertTo-SecureString 'Password123!' -AsPlainText -Force

          $existingUser = Get-LocalUser `
            -Name $user `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {
            Write-Host "runneradmin oluşturuluyor..."

            New-LocalUser `
              -Name $user `
              -Password $password `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword
          }
          else {
            Write-Host "runneradmin zaten var, şifre güncelleniyor..."

            Set-LocalUser `
              -Name $user `
              -Password $password
          }

          # Administrator grubuna ekle
          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $user `
            -ErrorAction SilentlyContinue

          # Remote Desktop servisinin çalıştığından emin ol
          $service = Get-Service -Name 'TermService'

          if ($service.Status -ne 'Running') {
            Start-Service -Name 'TermService'
          }

          # 3389 dinleniyor mu?
          Start-Sleep -Seconds 3

          $rdpPort = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $rdpPort) {
            Write-Host "RDP 3389 portunda dinlemiyor."
            exit 1
          }

          Write-Host "RDP aktif."
          Write-Host "Kullanıcı: $user"

      - name: 🌐 Serveo 443 Bağlantısını Test Et
        shell: pwsh
        run: |
          Write-Host "serveo.net:443 kontrol ediliyor..."

          $test = Test-NetConnection `
            -ComputerName 'serveo.net' `
            -Port 443 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            Write-Host "Serveo 443 portuna bağlantı kurulamadı."
            exit 1
          }

          Write-Host "serveo.net:443 erişilebilir."

      - name: 🚀 Serveo SSH Tünelini Başlat
        shell: pwsh
        run: |
          $stdoutLog = "$env:TEMP\serveo-out.log"
          $stderrLog = "$env:TEMP\serveo-err.log"

          Remove-Item $stdoutLog -Force -ErrorAction SilentlyContinue
          Remove-Item $stderrLog -Force -ErrorAction SilentlyContinue

          # Serveo private TCP tunnel
          # Uzak: rdp-gate:3389
          # GitHub runner: 127.0.0.1:3389
          $sshArgs = @(
            '-p', '443',
            '-N',
            '-T',
            '-o', 'StrictHostKeyChecking=no',
            '-o', 'UserKnownHostsFile=NUL',
            '-o', 'ExitOnForwardFailure=yes',
            '-o', 'ServerAliveInterval=30',
            '-o', 'ServerAliveCountMax=3',
            '-R', 'rdp-gate:3389:127.0.0.1:3389',
            'serveo.net'
          )

          Write-Host "Serveo SSH başlatılıyor..."

          $process = Start-Process `
            -FilePath 'ssh.exe' `
            -ArgumentList $sshArgs `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "SSH PID: $($process.Id)"

          Start-Sleep -Seconds 15

          if ($process.HasExited) {
            Write-Host ''
            Write-Host '=========================================='
            Write-Host 'SERVEO SSH BAŞLATILAMADI'
            Write-Host "ExitCode: $($process.ExitCode)"
            Write-Host '=========================================='
            Write-Host ''

            Write-Host '===== STDOUT ====='
            if (Test-Path $stdoutLog) {
              Get-Content $stdoutLog
            }

            Write-Host ''
            Write-Host '===== STDERR ====='
            if (Test-Path $stderrLog) {
              Get-Content $stderrLog
            }

            exit 1
          }

          Write-Host ''
          Write-Host '=========================================='
          Write-Host 'SERVEO TUNNEL AKTİF'
          Write-Host '=========================================='
          Write-Host ''

          Write-Host '===== STDOUT ====='
          if (Test-Path $stdoutLog) {
            Get-Content $stdoutLog
          }

          Write-Host ''
          Write-Host '===== STDERR ====='
          if (Test-Path $stderrLog) {
            Get-Content $stderrLog
          }

      - name: 🔎 Tunnel Kontrolü
        shell: pwsh
        run: |
          Write-Host "Serveo tunnel kontrol ediliyor..."

          Start-Sleep -Seconds 5

          Write-Host ''
          Write-Host '=========================================='
          Write-Host '          RDP BAĞLANTI BİLGİLERİ'
          Write-Host '=========================================='
          Write-Host ''

          Write-Host 'Kendi bilgisayarında CMD / PowerShell:'
          Write-Host ''
          Write-Host 'ssh -p 443 -N -L 3333:rdp-gate:3389 serveo.net'
          Write-Host ''
          Write-Host 'SSH penceresini kapatma.'
          Write-Host ''
          Write-Host 'Sonra Uzak Masaüstü:'
          Write-Host ''
          Write-Host '127.0.0.1:3333'
          Write-Host ''
          Write-Host 'Kullanıcı: runneradmin'
          Write-Host 'Şifre: Password123!'
          Write-Host ''
          Write-Host '=========================================='

      - name: ⏳ RDP ve Tunnel Açık Tut
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP + Serveo aktif..."
            Start-Sleep -Seconds 30
          }
