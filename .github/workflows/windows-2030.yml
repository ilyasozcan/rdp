name: WINDOWS 2029 RDP (Mutlak Kesin Çözüm)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 RDP Aktif Et ve Şifre Belirle
        shell: pwsh
        run: |
          # 1. RDP izinlerini açıp güçlü (örnek) bir şifre ayarlıyoruz
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

          # NOT: production ortamında buradaki sabit şifreyi kullanmayın. Örnek amaçlı 'Password123!' bırakıldı.
          net user runneradmin Password123!

      - name: 🚀 RDP için Güçlü, Yeniden Deneyen SSH Tünel (serveo.net)
        shell: pwsh
        run: |
          # Açıklama:
          # - ExitOnForwardFailure=yes: eğer remote alias/port alınamazsa ssh hemen çıkacak -> biz tekrar deneyeceğiz.
          # - ServerAliveInterval + ServerAliveCountMax: drop'ı daha hızlı tespit eder.
          # - Eğer alias çakışırsa alias'a kısa bir rastgele ek ekleyip tekrar deniyor.
          # - Başarılı olursa ekrana kullanıcı tarafında çalıştırılacak ssh -L komutunu basar.

          $baseAlias = "rdp-gate-$env:GITHUB_RUN_NUMBER"
          if (-not $env:GITHUB_RUN_NUMBER) {
            # GitHub Actions dışında test ediyorsanız alternatif anahtar:
            $baseAlias = "rdp-gate-$([int](Get-Random -Minimum 1000 -Maximum 9999))"
          }

          $alias = $baseAlias
          $attempt = 0

          while ($true) {
            $attempt++
            Write-Host "[$(Get-Date -Format o)] Deneme #$attempt ile SSH tüneli başlatılıyor. Alias = $alias"

            # SSH komutunu çalıştırıyoruz ve çıktıyı logluyoruz
            $log = "ssh-output.log"
            if (Test-Path $log) { Remove-Item $log -ErrorAction SilentlyContinue }

            $sshArgs = @(
              "-o", "StrictHostKeyChecking=no",
              "-o", "UserKnownHostsFile=/dev/null",
              "-o", "ExitOnForwardFailure=yes",
              "-o", "ServerAliveInterval=60",
              "-o", "ServerAliveCountMax=3",
              "-R", "$alias:22:127.0.0.1:3389",
              "serveo.net"
            )

            # Doğrudan ssh'yi çalıştır, çıktıyı kaydet
            & ssh @sshArgs 2>&1 | Tee-Object -FilePath $log

            # SSH çıkış yaptı, log'u incele
            $out = ""
            if (Test-Path $log) { $out = Get-Content $log -Raw }

            if ($out -match "Forwarding|forwarding|Forwarded|Forward established") {
              # Eğer burada "Forwarding" benzeri bir çıktı görünürse başarılı olmuş demektir.
              Write-Host "=========================================="
              Write-Host "🎉 Tünel başarılı şekilde açıldı (muhtemel)."
              Write-Host "Ekrana yazılan bilgileri inceleyin:"
              Write-Host $out
              Write-Host "Yerel makinenizde RDP'ye bağlanmak için (örnek):"
              Write-Host "1) Kendi bilgisayarınızda bir terminal açın ve şu komutu çalıştırın:"
              Write-Host "   ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -L 3333:$alias:22 serveo.net"
              Write-Host "2) Uzak Masaüstü (Remote Desktop) programında bağlanın: 127.0.0.1:3333"
              Write-Host "👤 Kullanıcı Adı: runneradmin"
              Write-Host "🔑 Şifre: Password123!"
              Write-Host "=========================================="
              Write-Host "NOT: Eğer bağlandıktan sonra tünel koparsa, bu workflow otomatik yeniden deneyecektir."
            } else {
              # Logta hata araması: genelde alias/port zaten kullanılıyor şeklinde mesaj olur
              Write-Host "[$(Get-Date -Format o)] SSH çıktı/hatada 'Forwarding' ifadesi bulunamadı. Log içeriği:"
              Write-Host $out
              Write-Host "5 saniye bekleyip yeni alias ile tekrar deneyeceğim..."
              Start-Sleep -Seconds 5
              # alias çakışması olursa benzersizleştir
              $alias = "$baseAlias-$([int](Get-Random -Minimum 1000 -Maximum 9999))"
              continue
            }

            # SSH disconn/çıkış yaptıysa kısa uyku ve tekrar dene (basit backoff)
            Write-Host "SSH bağlantısı sonlandı veya çöktü. 10s bekleyip yeniden bağlanıyorum..."
            Start-Sleep -Seconds 10
            # alias'ı koru (aynı alias ile devam et) veya istersen tekrar farklı alias ata:
            # $alias = "$baseAlias-$([int](Get-Random -Minimum 1000 -Maximum 9999))"
          }

      - name: ⏳ RDP'yi Açık Tut (Serviste döngü ile zaten tekrar deneyecek)
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
