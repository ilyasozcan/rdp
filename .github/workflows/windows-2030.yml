name: WINDOWS 2029 RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 RDP Aktif Et
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "RDP etkinleştiriliyor..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $user = "runneradmin"
          $password = ConvertTo-SecureString "Password123!" -AsPlainText -Force

          $existing = Get-LocalUser `
            -Name $user `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {
            New-LocalUser `
              -Name $user `
              -Password $password `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword
          }
          else {
            Set-LocalUser `
              -Name $user `
              -Password $password
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $user `
            -ErrorAction SilentlyContinue

          Start-Service TermService -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          $rdp = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $rdp) {
            throw "RDP 3389 portunda dinlemiyor."
          }

          Write-Host "RDP aktif."

      - name: 🚀 Serveo Tünelini Başlat
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stdout = "$env:TEMP\serveo-out.log"
          $stderr = "$env:TEMP\serveo-err.log"

          Remove-Item $stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $stderr -Force -ErrorAction SilentlyContinue

          # Farklı ve benzersiz alias
          $alias = "lofty-rdp"

          $args = @(
            "-p", "443",
            "-N",
            "-T",
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=NUL",
            "-o", "ServerAliveInterval=30",
            "-o", "ServerAliveCountMax=5",
            "-o", "ExitOnForwardFailure=yes",
            "-R", "${alias}:3389:127.0.0.1:3389",
            "serveo.net"
          )

          Write-Host "Serveo başlatılıyor..."
          Write-Host "Alias: $alias"
          Write-Host "Target: 127.0.0.1:3389"

          $process = Start-Process `
            -FilePath "ssh.exe" `
            -ArgumentList $args `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "SSH PID: $($process.Id)"

          Start-Sleep -Seconds 15

          if ($process.HasExited) {
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "SERVEO BAŞLATILAMADI"
            Write-Host "EXIT CODE: $($process.ExitCode)"
            Write-Host "=========================================="

            Write-Host ""
            Write-Host "===== STDOUT ====="
            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            Write-Host ""
            Write-Host "===== STDERR ====="
            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "SERVEO TUNNEL AÇIK"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "===== STDOUT ====="
          if (Test-Path $stdout) {
            Get-Content $stdout
          }

          Write-Host ""
          Write-Host "===== STDERR ====="
          if (Test-Path $stderr) {
            Get-Content $stderr
          }

      - name: 🌐 RDP Bağlantı Bilgileri
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RDP TÜNELİ"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Kendi bilgisayarında CMD aç:"
          Write-Host ""
          Write-Host "ssh -p 443 -N -L 3333:lofty-rdp:3389 serveo.net"
          Write-Host ""
          Write-Host "SSH penceresini kapatma."
          Write-Host ""
          Write-Host "Uzak Masaüstü:"
          Write-Host "127.0.0.1:3333"
          Write-Host ""
          Write-Host "Kullanıcı: runneradmin"
          Write-Host "Şifre: Password123!"
          Write-Host ""
          Write-Host "=========================================="

      - name: 🔎 Tunnel Durumu
        shell: pwsh
        run: |
          Write-Host "Serveo tunnel kontrolü..."

          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP + Serveo aktif..."
            Start-Sleep -Seconds 30
          }
